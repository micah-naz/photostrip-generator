<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photostrips · Log in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4efe9; color: #2a2522; padding: 16px;
    }
    form {
      width: 100%; max-width: 340px; background: #fff; border-radius: 16px;
      padding: 28px 24px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #6b625c; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; font-size: 1.1rem; padding: 12px; border: 1px solid #d8cfc7;
      border-radius: 10px; margin-bottom: 16px;
    }
    button {
      width: 100%; font-size: 1.1rem; padding: 12px; border: 0; border-radius: 10px;
      background: #2a2522; color: #fff; font-weight: 600;
    }
    .error { color: #b3261e; margin: -4px 0 14px; display: none; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Photostrips</h1>
    <p>Enter your password to get started.</p>
    <div class="error" id="error"></div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
  </form>
  <script>
    const err = new URLSearchParams(location.search).get('error');
    const box = document.getElementById('error');
    if (err === 'wrong') { box.textContent = 'That password is not right.'; box.style.display = 'block'; }
    if (err === 'wait') { box.textContent = 'Too many tries. Wait 15 minutes and try again.'; box.style.display = 'block'; }
  </script>
</body>
</html>
